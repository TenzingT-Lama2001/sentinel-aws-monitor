name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: CDK synth
        run: npx cdk synth
        env:
          AWS_ACCOUNT_ID: '123456789012'
          AWS_REGION_SYDNEY: ap-southeast-2
          AWS_REGION_SINGAPORE: ap-southeast-1
          ALERT_EMAIL: ci-placeholder@example.com